<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerador Oficial de Desculpas - Sepor</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100" style="margin: 0;">

    <div class="card shadow p-4 text-center" style="max-width: 500px; width: 100%;">
        <div class="card-body">
            
            <i class="fa-solid fa-user-tie fa-3x text-secondary mb-3"></i>
            
            <h2 class="card-title h4 text-dark mb-4">Gerador de Desculpas para o Chefe</h2>
            
            <div class="alert alert-danger my-4 py-3 border-0 shadow-sm">
                <p class="fs-5 fw-bold mb-0" th:text="${textoDesculpa}">
                </p>
            </div>
            
            <a href="/desculpa" class="btn btn-primary btn-lg px-4 shadow-sm">
                <i class="fa-solid fa-rotate"></i> Gerar Nova Desculpa
            </a>
            
        </div>
    </div>

</body>
</html>
